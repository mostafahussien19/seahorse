function pluginDrawer(id) {
  if (!market.data) { loadMarket(); return { eyebrow: '', title: esc(id.split('@')[0]), body: '<p class="loading">Loading the catalog…</p>' }; }
  const p = findPlugin(id) ?? { name: id.split('@')[0] };
  const installed = installedSet().has(id);
  const users = assignedTo(id);
  const busy = market.busy.has(id);
  return {
    eyebrow: `${p.category ? `<span class="tag">${esc(cap(p.category))}</span>` : ''} ${installed ? '<span class="badge s-blue">installed</span>' : ''}`,
    title: esc(p.name ?? id),
    body: `
      <div class="actions">
        ${installed
          ? `<button type="button" class="btn secondary" data-plugin-action="uninstall" data-plugin-id="${esc(id)}" ${busy ? 'disabled' : ''}>${busy ? 'Removing…' : 'Uninstall from project'}</button>`
          : `<button type="button" class="btn" data-plugin-action="install" data-plugin-id="${esc(id)}" ${busy ? 'disabled' : ''}>${busy ? 'Installing…' : 'Install in this project'}</button>`}
        ${p.homepage ? `<a class="btn secondary" href="${esc(p.homepage)}" target="_blank" rel="noopener noreferrer">Homepage</a>` : ''}
      </div>
      <p class="tag">Installs with <code>claude plugin install ${esc(id)} --scope project</code>, so it lands in this workspace's .claude/settings.json for everyone on the project.</p>
      <h3 class="rule">About</h3><div class="prose">${esc(p.description || 'No description in the marketplace.')}</div>
      <dl class="kv" style="margin-top:10px">
        <dt>Plugin id</dt><dd class="mono">${esc(id)}</dd>
        ${p.author ? `<dt>Author</dt><dd>${esc(p.author)}</dd>` : ''}
        ${p.version ? `<dt>Version</dt><dd>${esc(p.version)}</dd>` : ''}
        ${p.installCount ? `<dt>Installs</dt><dd>${esc(p.installCount.toLocaleString())}</dd>` : ''}
      </dl>
      <h3 class="rule">Agents that use it <small>${users.length}</small></h3>
      ${installed ? `<p class="tag">When you start a checked agent from Seahorse, its prompt tells it to use this plugin's skills where they help.</p>
        ${Object.keys(agents()).map((r) => `<label class="check-row"><input type="checkbox" data-skill-agent="${esc(r)}" data-skill-plugin="${esc(id)}" ${users.includes(r) ? 'checked' : ''}>
          <span>${esc(roleName(r))}</span><span class="mono">${esc(agents()[r])}</span></label>`).join('')}`
        : '<div class="empty">Install it first, then pick the agents that should use it.</div>'}
    `,
  };
}

async function runPluginAction(action, id, btn) {
  if (market.busy.has(id)) return;
  market.busy.add(id);
  render();
  renderDrawer();
  toast(`${action === 'install' ? 'Installing' : 'Removing'} <code>${esc(id)}</code>. This can take a minute…`, { sticky: true });
  try {
    const out = await post('/api/plugins', { action, pluginId: id });
    market.data = { ...market.data, installed: out.installed };
    if (out.ok) {
      toast(action === 'install' ? `Installed <code>${esc(id)}</code>. Now tick the agents that should use it.` : `Removed <code>${esc(id)}</code> from this project.`);
      if (action === 'install') openDrawer('plugin', id);
    } else {
      toast(`The claude CLI couldn't ${action} it:<pre>${esc(out.output)}</pre>`, { error: true, sticky: true });
    }
  } catch (err) {
    toast(`Couldn't ${action} <code>${esc(id)}</code>: ${esc(err.message)}`, { error: true, sticky: true });
  } finally {
    market.busy.delete(id);
    render();
    renderDrawer();
  }
}

async function setSkill(pluginId, agent, on, input) {
  input.disabled = true;
  try {
    const out = await post('/api/skills', { pluginId, agent, on });
    state = { ...state, skills: out.skills };
    render();
    renderDrawer();
    toast(on ? `${roleName(agent)} will be told to use ${esc(pluginId.split('@')[0])} when you start it from Seahorse.` : `${roleName(agent)} won't be told to use ${esc(pluginId.split('@')[0])} any more.`);
  } catch (err) {
    input.checked = !on;
    input.disabled = false;
    toast(`Couldn't save: ${esc(err.message)}`, { error: true, sticky: true });
  }
}

// ---------- feedback ----------
const SOURCE_LABEL = { agent: 'Agent recorded', you: 'You logged', reviewer: 'Reviewer rejected' };
const fbItems = () => state?.feedback?.items ?? [];
const proposals = () => state?.proposals ?? [];
// Repeats that still need attention: no accepted proposal yet.
const openRepeats = () => (state?.feedback?.clusters ?? []).filter((c) => !proposals().some((p) => p.cluster === c.id && p.status === 'accepted'));
const agentLabel = (r) => (r ? roleName(r) : 'Unassigned');

function proposalCard(p) {
  const kind = { lesson: 'Lesson', plugin: 'Plugin', agent: 'New agent' }[p.kind];
  let detail = '';
  if (p.kind === 'lesson' && p.lesson) detail = `<p><b>Rule:</b> ${esc(p.lesson.fix ?? '')}</p>`;
  if (p.kind === 'plugin') detail = `<p><b>${esc(String(p.pluginId ?? '').split('@')[0])}</b>${(p.agents ?? []).length ? ` for ${esc(p.agents.map(roleName).join(', '))}` : ''}</p>`;
  if (p.kind === 'agent' && p.agent) detail = `<p><b>${esc(p.agent.name ?? '')}</b>: ${esc(p.agent.description ?? '')}${(p.agent.writes ?? []).length ? ` <span class="tag">writes ${esc(p.agent.writes.join(', '))}</span>` : ''}</p>`;
  const acceptLabel = { lesson: 'Send to Lead to file it', plugin: 'Open the plugin', agent: 'Create this agent' }[p.kind];
  return `<div class="proposal ${esc(p.status)}">
    <div class="eyebrow"><span class="badge ${p.kind === 'agent' ? 's-red' : 's-blue'}">${kind}</span> ${p.status !== 'open' ? `<span class="badge s-muted">${esc(p.status)}</span>` : ''}</div>
    <div class="lr-title" style="font-family:var(--serif);font-weight:600;margin-top:4px">${esc(p.title ?? '')}</div>
    <p class="tag" style="margin:4px 0">${esc(p.reason ?? '')}</p>
    ${detail}
    <div class="actions">
      ${p.status === 'open'
        ? `<button type="button" class="btn small" data-proposal-accept="${esc(p.id)}">${acceptLabel}</button>
           <button type="button" class="btn small secondary" data-proposal-status="dismissed" data-proposal-id="${esc(p.id)}">Dismiss</button>`
        : `<button type="button" class="link-btn" data-proposal-status="open" data-proposal-id="${esc(p.id)}">Reopen</button>`}
    </div>
  </div>`;
}

function evidenceLine(it) {
  return `<li><span class="tag">${fmtDay(it.when) || 'Undated'}<br>${esc(SOURCE_LABEL[it.source] ?? it.source)}</span>
    <span>${esc(it.text)}${it.project ? ` <a href="#/projects" data-open-project="${esc(it.project)}" class="tag">${esc(it.project)}</a>` : ''}
    ${it.source === 'you' ? ` <button type="button" class="link-btn" data-fb-remove="${esc(it.id.slice(2))}">Remove</button>` : ''}</span></li>`;
}

function renderFeedback(main) {
  const items = fbItems();
  const clusters = state.feedback?.clusters ?? [];
  const info = state.agentInfo ?? {};
  const withRule = Object.values(info).filter((a) => a.feedbackRule).length;
  const total = Object.keys(info).length;
  const needsSetup = withRule < total || !state.feedback?.schemaReady;
  const byId = new Map(items.map((i) => [i.id, i]));
  const clusterIds = new Set(clusters.map((c) => c.id));
  const orphanProposals = proposals().filter((p) => !clusterIds.has(p.cluster));
  const list = items.filter((i) => (!ui.fbFilterAgent || (i.agent ?? '') === ui.fbFilterAgent) && (!ui.fbFilterSource || i.source === ui.fbFilterSource));

  main.innerHTML = `
    <div class="page-head"><h2>Feedback</h2><p>What you corrected, and fixes for the things that keep coming back</p></div>
    ${needsSetup ? `<div class="notice">
      ${withRule} of ${plural(total, 'agent')} record your corrections${!state.feedback?.schemaReady ? ', and the message schema rejects a user_feedback field' : ''}.
      Seahorse can add a short "User feedback" rule to each agent file${!state.feedback?.schemaReady ? ' and allow the field in orchestrator/schemas/agent-message.schema.json' : ''}.
      <div class="actions"><button type="button" class="btn" data-feedback-setup>Add the feedback rule</button></div></div>` : ''}

    <h3 class="rule">Log a dislike</h3>
    <div class="fb-form">
      <select id="fb-agent" class="select-inline" aria-label="Which agent">${options(Object.keys(agents()), ui.fbAgent, 'Which agent? (optional)').replace(/>([a-z_]+)</g, (m, r) => `>${esc(roleName(r))}<`)}</select>
      <select id="fb-project" class="select-inline" aria-label="Which project"><option value="">Which project? (optional)</option>${projectList().map((p) => `<option value="${esc(p.id)}" ${p.id === ui.fbProject ? 'selected' : ''}>${esc(p.id)}</option>`).join('')}</select>
      <textarea id="fb-text" aria-label="What you didn't like" placeholder="What didn't you like? e.g. It used inline styles again">${esc(ui.fbText)}</textarea>
    </div>
    <div class="actions"><button type="button" class="btn" data-fb-log>Log it</button></div>

    <h3 class="rule">Keeps coming back <small>${clusters.length}</small></h3>
    ${clusters.length ? clusters.map((c) => {
      const ps = proposals().filter((p) => p.cluster === c.id);
      const evidence = c.items.map((id) => byId.get(id)).filter(Boolean);
      return `<section class="repeat">
        <h4>${esc(agentLabel(c.agent))}: ${esc(c.label.join(', ') || 'similar feedback')}</h4>
        <div class="tag">${plural(evidence.length, 'time')} across ${plural(c.occasions, 'occasion')}${c.last ? `, last ${fmtDay(c.last)}` : ''}</div>
        <ul class="ev-list">${evidence.map(evidenceLine).join('')}</ul>
        ${ps.map(proposalCard).join('')}
        <div class="actions"><button type="button" class="btn ${ps.length ? 'secondary' : ''}" data-reflect="${esc(c.id)}">${ps.length ? 'Ask Claude again' : 'Ask Claude for a fix'}</button></div>
        ${ps.length ? '' : '<p class="tag">Claude reads this feedback and the agent\'s instructions, then proposes a lesson, a plugin, or a new agent. Nothing changes until you accept one.</p>'}
      </section>`;
    }).join('') : `<div class="empty">Nothing has come up twice yet. When the same correction repeats for an agent, it shows here with a way to fix it for good.</div>`}

    ${orphanProposals.length ? `<h3 class="rule">Earlier proposals <small>${orphanProposals.length}</small></h3>${orphanProposals.map(proposalCard).join('')}` : ''}

    <h3 class="rule">All feedback <small>${items.length}</small></h3>
    <div class="toolbar">
      <select id="fb-f-agent" aria-label="Filter by agent">${options([...new Set(items.map((i) => i.agent).filter(Boolean))], ui.fbFilterAgent, 'Any agent')}</select>
      <select id="fb-f-source" aria-label="Filter by source">${options(['agent', 'you', 'reviewer'], ui.fbFilterSource, 'Any source').replace(/>(agent|you|reviewer)</g, (m, s) => `>${SOURCE_LABEL[s]}<`)}</select>
    </div>
    ${list.length ? `<ul class="ev-list">${list.map((it) => evidenceLine({ ...it, text: `${agentLabel(it.agent)}: ${it.text}` })).join('')}</ul>`
      : `<div class="empty">${items.length ? 'No feedback matches these filters.' : 'No feedback yet. Agents record your corrections once they have the feedback rule, and reviewer rejections appear here automatically.'}</div>`}`;

  const bind = (id, key, ev = 'change') => document.getElementById(id)?.addEventListener(ev, (e) => { ui[key] = e.target.value; if (ev === 'change') render(); });
  bind('fb-agent', 'fbAgent');
  bind('fb-project', 'fbProject');
  bind('fb-text', 'fbText', 'input');
  bind('fb-f-agent', 'fbFilterAgent');
  bind('fb-f-source', 'fbFilterSource');
}

async function logDislike() {
  if (!ui.fbText.trim()) { toast('Write what you didn\'t like first.', { error: true }); document.getElementById('fb-text')?.focus(); return; }
  try {
    await post('/api/feedback', { agent: ui.fbAgent, project: ui.fbProject, text: ui.fbText });
    ui.fbText = '';
    toast('Logged. If it comes up again, Seahorse will group it and offer a fix.');
    render();
  } catch (err) {
    toast(`Couldn't log it: ${esc(err.message)}`, { error: true, sticky: true });
  }
}

function dislike(agent, project) {
  ui.fbAgent = agent ?? '';
  ui.fbProject = project ?? '';
  if (ui.drawer) closeDrawer();
  location.hash = '#/feedback';
  render();
  document.getElementById('fb-text')?.focus();
}

async function acceptProposal(id) {
  const p = proposals().find((x) => x.id === id);
  if (!p) return;
  if (p.kind === 'lesson') {
    await launchAgent({ agent: 'lead_agent', kind: 'proposal', id });
    await setProposal(id, 'accepted');
  } else if (p.kind === 'plugin') {
    await setProposal(id, 'accepted');
    openDrawer('plugin', p.pluginId);
    toast(`Install it if needed, then tick ${(p.agents ?? []).map(roleName).join(', ') || 'the agents that should use it'}.`, { sticky: true });
  } else if (p.kind === 'agent') {
    const a = p.agent ?? {};
    ui.newAgentResult = null;
    ui.newAgentError = null;
    ui.newAgentPrefill = { name: a.name ?? '', role: a.role ?? '', description: a.description ?? '', purpose: a.purpose ?? '', writes: (a.writes ?? []).join('\n') };
    ui.newAgentProposal = id;
    document.getElementById('drawer-root').innerHTML = '';
    openDrawer('newAgent', 'new');
  }
}

async function setProposal(id, status) {
  try {
    await post('/api/proposals', { id, status });
    state = { ...state, proposals: proposals().map((p) => (p.id === id ? { ...p, status } : p)) };
    render();
  } catch (err) {
    toast(`Couldn't update the proposal: ${esc(err.message)}`, { error: true, sticky: true });
  }
}

async function startReflect(cluster) {
  toast('Preparing the feedback for Claude…', { sticky: true });
  try {
    const out = await post('/api/reflect', { cluster });
    if (out.launched) toast('Opened <code>/seahorse-reflect</code> in a new Terminal window. Its proposals appear here when it finishes.');
    else toast(`Run this to get proposals:<pre>${esc(out.command)}</pre><div class="actions"><button class="btn" type="button" data-copy="${esc(out.command)}">Copy command</button></div>`, { sticky: true, error: !!out.error });
  } catch (err) {
    toast(`Couldn't start the reflection: ${esc(err.message)}`, { error: true, sticky: true });
  }
}

// ---------- setup (onboarding) ----------
function obState() {
  const ob = state.onboarding ?? {};
  const pr = ob.proposal;
  // Fresh selections whenever a new proposal arrives.
  if (pr && (!ui.ob || ui.ob.proposalAt !== ob.proposalAt)) {
    const existing = state.agentInfo ?? {};
    ui.ob = {
      proposalAt: ob.proposalAt,
      prefix: ob.prefix ?? `${pr.project.slug}-`,
      agents: Object.fromEntries(pr.agents.map((a) => [a.role, { include: !existing[a.role], writes: a.writes.join('\n') }])),
      plugins: Object.fromEntries(pr.plugins.map((p) => [p.pluginId, { include: true }])),
      backlog: true,
      report: null, progress: [], busy: false,
    };
  }
  return ob;
}

    ${!market.data ? `<p class="loading">${market.error ? `Couldn't load the catalog: ${esc(market.error)}` : 'Checking the plugin catalog…'}</p>` : ''}
    ${pr.plugins.map((p) => {
      const known = !market.data || catalogIds.has(p.pluginId) || installed.has(p.pluginId);
      const isInstalled = installed.has(p.pluginId);
      return `<div class="panel pick">
        <input type="checkbox" data-ob-plugin="${esc(p.pluginId)}" ${s.plugins[p.pluginId].include && known && !isInstalled ? 'checked' : ''} ${known && !isInstalled ? '' : 'disabled'} aria-label="Install ${esc(p.pluginId)}">
        <div><h4>${esc(p.pluginId.split('@')[0])} ${isInstalled ? '<span class="badge s-blue">installed</span>' : ''}${known ? '' : ' <span class="badge s-red">not in your marketplaces</span>'}</h4>
          <p style="margin:0 0 6px">${esc(p.why)}</p>
          ${p.agents.length ? `<div class="tag">For ${esc(p.agents.map(roleName).join(', '))}</div>` : ''}</div></div>`;
    }).join('')}`;

  const backlogBody = !pr ? '<p>After discovery: issues it found, with the file that shows each one.</p>' : !pr.backlog.length ? '<div class="empty">Discovery found no issues to log.</div>' : `
    ${configured
      ? '<p>backlog.json already exists and belongs to the lead, so these are listed for reference only. Send the ones you want to the Lead from the Backlog page after logging them.</p>'
      : `<label class="check-row"><input type="checkbox" id="ob-backlog" ${s.backlog ? 'checked' : ''}><span>Start backlog.json with these ${plural(pr.backlog.length, 'issue')}</span></label>`}
    <ul class="ev-list">${pr.backlog.map((b) => `<li><span>${prioBadge(b.priority)}<br><span class="mono tag">${esc(b.id)}</span></span><span>${esc(b.title)} <span class="mono tag">${esc(b.evidence)}</span></span></li>`).join('')}</ul>`;

  const applyBody = !pr ? '<p>Seahorse writes the agent files and the orchestrator memory, then installs the plugins you kept. Existing files are never overwritten.</p>' : `
    <p>Creates the agent files and the orchestrator memory (core.md with the permission matrix, domain_context.md, patterns, empty lessons), then installs the ticked plugins and assigns them. Files that already exist are kept as they are.</p>
    <div class="actions"><button type="button" class="btn" data-onboard-apply ${s.busy ? 'disabled' : ''}>${s.busy ? 'Working…' : configured ? 'Add what\'s missing' : 'Create the team'}</button></div>
    ${s.progress.length ? `<ul class="plain progress">${s.progress.map((x) => `<li>${esc(x.label)}: <b>${esc(x.status)}</b></li>`).join('')}</ul>` : ''}
    ${s.report ? `<details class="entry" open><summary>Files <span class="tag">${s.report.filter((r) => r.status === 'created').length} created, ${s.report.filter((r) => r.status === 'kept').length} kept</span></summary>
      <ul class="plain">${s.report.map((r) => `<li><span class="mono">${esc(r.path)}</span> <span class="tag">${esc(r.status)}</span></li>`).join('')}</ul></details>
      ${s.busy ? '' : `<div class="panel"><h4>Next</h4><ol class="steps">
        <li>Read <span class="mono">orchestrator/memory/core.md</span> and add any rule discovery missed. Only you edit it.</li>
        <li>Open the <a href="#/agents">Agents</a> page to see the team, then start the Lead from the <a href="#/backlog">Backlog</a>.</li></ol></div>`}` : ''}`;

  const done1 = !!pr;
  const done2 = !!s?.report;
  main.innerHTML = `
    <div class="page-head"><h2>Setup</h2><p>${configured ? 'This workspace is set up. Discovery can still suggest agents and tools you don\'t have yet; applying only adds what\'s missing.' : `Turn ${esc(state.workspace)} into an agent team: discover the project, review the team and its permissions, pick tools.`}</p></div>
    ${step(1, 'Discover the project', done1 ? 'done' : 'current', discoverBody)}
    ${step(2, 'Agents and permissions', done1 && !done2 ? 'current' : done2 ? 'done' : '', agentsBody)}
    ${step(3, 'Tools', done1 && !done2 ? 'current' : done2 ? 'done' : '', toolsBody)}
    ${step(4, 'Starting backlog', done1 && !done2 ? 'current' : done2 ? 'done' : '', backlogBody)}
    ${step(5, 'Create', done2 ? 'done' : done1 ? 'current' : '', applyBody)}`;

  document.getElementById('ob-prefix')?.addEventListener('input', (e) => { s.prefix = e.target.value; });
  document.getElementById('ob-backlog')?.addEventListener('change', (e) => { s.backlog = e.target.checked; });
  main.querySelectorAll('[data-ob-agent]').forEach((el) => el.addEventListener('change', () => { s.agents[el.dataset.obAgent].include = el.checked; render(); }));
  main.querySelectorAll('[data-ob-writes]').forEach((el) => el.addEventListener('input', () => { s.agents[el.dataset.obWrites].writes = el.value; }));
  main.querySelectorAll('[data-ob-plugin]').forEach((el) => el.addEventListener('change', () => { s.plugins[el.dataset.obPlugin].include = el.checked; }));
}

async function startOnboarding() {
  toast('Preparing discovery…', { sticky: true });
  try {
    const out = await post('/api/onboarding/start', {});
    if (out.launched) toast('Opened <code>/seahorse-onboard</code> in a new Terminal window. Its proposal appears here when it finishes.');
    else toast(`Run this to start discovery:<pre>${esc(out.command)}</pre><div class="actions"><button class="btn" type="button" data-copy="${esc(out.command)}">Copy command</button></div>`, { sticky: true, error: !!out.error });
  } catch (err) {
    toast(`Couldn't start discovery: ${esc(err.message)}`, { error: true, sticky: true });
  }
}

async function applyOnboarding() {
  const s = ui.ob;
  const pr = state.onboarding?.proposal;
  if (!s || !pr || s.busy) return;
  const existing = state.agentInfo ?? {};
  const agentsSel = pr.agents.filter((a) => s.agents[a.role].include && !existing[a.role])
    .map((a) => ({ role: a.role, writes: s.agents[a.role].writes.split('\n').map((w) => w.trim()).filter(Boolean) }));
  const installed = installedSet();
  const pluginsSel = pr.plugins.filter((p) => s.plugins[p.pluginId].include && !installed.has(p.pluginId) && (market.data?.available ?? []).some((x) => x.pluginId === p.pluginId));
  s.busy = true;
  s.progress = [{ label: 'Agent files and memory', status: 'writing' }];
  render();
  try {
    const out = await post('/api/onboarding/apply', { prefix: s.prefix, agents: agentsSel, backlog: s.backlog });
    s.report = out.report;
    s.progress[0].status = 'done';
    render();
    await load();
    for (const p of pluginsSel) {
      const row = { label: `Install ${p.pluginId.split('@')[0]}`, status: 'installing' };
      s.progress.push(row);
      render();
      try {
        const res = await post('/api/plugins', { action: 'install', pluginId: p.pluginId });
        market.data = { ...market.data, installed: res.installed };
        row.status = res.ok ? 'installed' : 'failed (see the Skills page)';
        if (res.ok) {
          for (const role of p.agents.filter((r) => state.agents?.[r])) await post('/api/skills', { pluginId: p.pluginId, agent: role, on: true });
        }
      } catch (err) {
        row.status = `failed: ${err.message}`;
      }
      render();
    }
    toast(state.configured ? 'Your agent team is ready.' : 'Done.');
  } catch (err) {
    s.progress[0].status = `failed: ${err.message}`;
    toast(`Couldn't create the team: ${esc(err.message)}`, { error: true, sticky: true });
  } finally {
    s.busy = false;
    await load();
  }
}

// ---------- detail panel ----------
let lastFocus = null;
function renderDrawer() {
  const root = document.getElementById('drawer-root');
  const builders = { item: itemDrawer, project: projectDrawer, lesson: lessonDrawer, agent: agentDrawer, plugin: pluginDrawer, newAgent: newAgentDrawer };
  const d = ui.drawer && builders[ui.drawer.type]?.(ui.drawer.id);
  if (!d) { root.innerHTML = ''; return; }
  const scroll = root.querySelector('.drawer-body')?.scrollTop ?? 0;
  const openDetails = [...root.querySelectorAll('details')].map((el) => el.open);
  // Live refreshes must not wipe what someone is typing into a form in the panel.
  const fields = Object.fromEntries([...root.querySelectorAll('input[id], textarea[id]')].map((el) => [el.id, el.value]));
  const focused = document.activeElement?.closest?.('#drawer-root') ? document.activeElement.id : null;
  root.innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <div><div class="eyebrow">${d.eyebrow}</div><h2 id="drawer-title">${d.title}</h2></div>
        <button class="theme-btn close" type="button" data-close>Close</button>
      </div>
      <div class="drawer-body">${d.body}</div>
    </aside>`;
  // Live refreshes re-render the panel; keep the reader's place.
  root.querySelectorAll('details').forEach((el, n) => { if (openDetails[n]) el.open = true; });
  for (const [id, value] of Object.entries(fields)) { const el = document.getElementById(id); if (el && el.type !== 'checkbox') el.value = value; }
  if (focused) document.getElementById(focused)?.focus();
  root.querySelector('.drawer-body').scrollTop = scroll;
  d.after?.();
}

function openDrawer(type, id) {
  if (!ui.drawer) lastFocus = document.activeElement;
  ui.drawer = { type, id };
  renderDrawer();
  document.querySelector('.drawer .close')?.focus();
}
function closeDrawer() {
  ui.drawer = null;
  renderDrawer();
  lastFocus?.focus?.();
}

document.addEventListener('click', (e) => {
  const launchBtn = e.target.closest('[data-launch-agent]');
  if (launchBtn) {
    const d = launchBtn.dataset;
    return launchAgent({ agent: d.launchAgent, kind: d.launchKind, id: d.launchId, project: d.launchProject || undefined, action: d.launchAction, from: d.launchFrom });
  }
  const agentLink = e.target.closest('[data-open-agent]');
  if (agentLink) {
    e.preventDefault();
    if (agentLink.tagName === 'A' && route() !== 'agents') location.hash = '#/agents';
    return openDrawer('agent', agentLink.dataset.openAgent);
  }
  const pluginLink = e.target.closest('[data-open-plugin]');
  if (pluginLink) return openDrawer('plugin', pluginLink.dataset.openPlugin);
  if (e.target.closest('[data-onboard-start]')) return startOnboarding();
  if (e.target.closest('[data-onboard-apply]')) return applyOnboarding();
  if (e.target.closest('[data-feedback-setup]')) return setupFeedbackRule();
  if (e.target.closest('[data-fb-log]')) return logDislike();
  const fbRemove = e.target.closest('[data-fb-remove]');
  if (fbRemove) return post('/api/feedback', { remove: fbRemove.dataset.fbRemove }).then(() => toast('Removed.'), (err) => toast(esc(err.message), { error: true }));
  const reflect = e.target.closest('[data-reflect]');
  if (reflect) return startReflect(reflect.dataset.reflect);
  const accept = e.target.closest('[data-proposal-accept]');
  if (accept) return acceptProposal(accept.dataset.proposalAccept);
  const pStatus = e.target.closest('[data-proposal-status]');
  if (pStatus) return setProposal(pStatus.dataset.proposalId, pStatus.dataset.proposalStatus);
  const dis = e.target.closest('[data-dislike-agent]');
  if (dis) return dislike(dis.dataset.dislikeAgent, dis.dataset.dislikeProject);
  if (e.target.closest('[data-new-agent]')) {
    ui.newAgentResult = null;
    ui.newAgentError = null;
    ui.newAgentPrefill = null;
    ui.newAgentProposal = null;
    document.getElementById('drawer-root').innerHTML = ''; // start with an empty form
    return openDrawer('newAgent', 'new');
  }
  if (e.target.closest('[data-wf-switch]')) { ui.workflowProject = state.orchestrator?.active_project ?? ''; return render(); }
  const pluginBtn = e.target.closest('[data-plugin-action]');
  if (pluginBtn) return runPluginAction(pluginBtn.dataset.pluginAction, pluginBtn.dataset.pluginId, pluginBtn);
  if (e.target.closest('[data-create-agent]')) return submitNewAgent();
  if (e.target.closest('[data-market-retry]')) { market.error = null; market.data = null; return loadMarket(true); }
  if (e.target.closest('[data-market-more]')) { ui.marketLimit += 40; return render(); }
  const lesson = e.target.closest('[data-open-lesson]');
  if (lesson) {
    e.preventDefault();
    if (lesson.tagName === 'A' && route() !== 'lessons') location.hash = '#/lessons';
    return openDrawer('lesson', lesson.dataset.openLesson);
  }
  const copy = e.target.closest('[data-copy]');
  if (copy) {
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => { copy.textContent = 'Copied'; }, () => { copy.textContent = 'Copy failed, select the text above'; });
    return;
  }
  if (e.target.closest('[data-toast-close]')) { document.getElementById('toast-root').innerHTML = ''; return; }
  if (e.target.closest('[data-close]')) return closeDrawer();
  const item = e.target.closest('[data-open-item]');
  if (item) return openDrawer('item', item.dataset.openItem);
  const project = e.target.closest('[data-open-project]');
  if (project) {
    e.preventDefault();
    if (project.tagName === 'A' && route() !== 'projects') location.hash = '#/projects';
    return openDrawer('project', project.dataset.openProject);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ui.drawer) return closeDrawer();
  // Cards are divs (buttons don't drag reliably in every browser), so give them button keys.
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.card[role="button"]')) {
    e.preventDefault();
    e.target.click();
  }
});

// ---------- main render + live updates ----------
function render() {
  if (!state) return;
  renderHeader();
  const main = document.getElementById('main');
  const view = route();
  const views = {
    projects: renderProjects, lessons: renderLessons, workflow: renderWorkflow, agents: renderAgents,
    skills: renderSkills, feedback: renderFeedback, setup: renderSetup,
  };
  // Live refreshes redraw the page; keep the caret where someone is typing.
  const focused = document.activeElement?.closest?.('#main') ? document.activeElement : null;
  const keep = focused?.id ? { id: focused.id, start: focused.selectionStart, end: focused.selectionEnd } : null;
  (views[view] ?? renderBacklog)(main);
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el && el !== document.activeElement) {
      el.focus();
      try { if (keep.start != null) el.setSelectionRange(keep.start, keep.end); } catch {}
    }
  }
  const errs = state.errors ?? [];
  if (errs.length) {
    main.insertAdjacentHTML('afterbegin', `<div class="notice">Couldn't parse ${errs.map((e) => `<code>${esc(e.file)}</code>`).join(', ')}, probably mid-write. Showing the last version that parsed.</div>`);
  }
}

async function load() {
  if (drag) { pendingReload = true; return; }
  try {
    const res = await fetch('/api/state');
    if (!res.ok) throw new Error(`server answered ${res.status}`);
    state = await res.json();
    reviewCache.clear();
    render();
    renderDrawer();
  } catch (err) {
    document.getElementById('main').innerHTML = `<div class="notice">Couldn't read the workspace (${esc(err.message)}). Check that the Seahorse server is still running, then reload.</div>`;
  }
}

function connect() {
  const live = document.getElementById('live');
  const text = document.getElementById('live-text');
  const es = new EventSource('/events');
  es.onopen = () => { live.className = 'live on'; text.textContent = 'Watching files'; load(); };
  es.onmessage = () => { load(); text.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`; };
  es.onerror = () => { live.className = 'live off'; text.textContent = 'Server offline, retrying'; };
}

window.addEventListener('hashchange', render);
connect();
load();
</script>
